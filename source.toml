
[runtimes.enabled]
rust = "nightly"

[smells]
mode = "comment"

[[plugin]]
name = "checkov"
skip_upstream = true

[[plugin]]
name = "trufflehog"
skip_upstream = true

[[plugin]]
name = "prettier"
version = "3.4.1"

[[plugin]]
name = "actionlint"

[[plugin]]
name = "markdownlint"
version = "0.41.0"
drivers = ["lint"]

[[plugin]]
name = "dotenv-linter"

[[plugin]]
name = "ripgrep"

[[plugin]]
name = "eslint"
version = "8.57.1"
package_file = ".qlty/configs/package.json"

[[plugin]]
name = "stylelint"
version = "15.10.3"
extra_packages = ["stylelint-config-standard-scss@11.0.0"]

[[plugin]]
name = "knip"

[[plugin]]
name = "tsc"
version = "5.5.2"

[[plugin]]
name = "terraform"

[[plugin]]
name = "clippy"

[[plugin]]
name = "rustfmt"

[[plugin]]
name = "osv-scanner"
skip_upstream = true
# Disable during Git hooks because it is slow and requires network
triggers = ["manual", "build"]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "shfmt"

[[plugin]]
name = "yamllint"
